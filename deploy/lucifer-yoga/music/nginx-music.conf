# LPlayer 在线音乐后端：网易云 /netease/ + QQ 音乐 /qq/
server {
    listen 80;
    listen [::]:80;
    server_name music.lucifer.yoga;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; try_files $uri =404; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name music.lucifer.yoga;

    ssl_certificate     /etc/letsencrypt/live/music.lucifer.yoga/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/music.lucifer.yoga/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 4m;

    # 不要把 ?cookie= 写进日志（格式定义见 /etc/nginx/conf.d/folia-log.conf）
    access_log /var/log/nginx/music-api.log folia_noquery;
    # error.log 里的 request 行同样带 ?cookie=，单独归档并限制保留天数
    error_log /var/log/nginx/music-error.log warn;

    location = /healthz { access_log off; return 200 "ok"; }

    location /netease/ {
        proxy_pass http://127.0.0.1:3100/;
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
        proxy_hide_header Set-Cookie;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /qq/ {
        proxy_pass http://127.0.0.1:3200/;
        proxy_hide_header Set-Cookie;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /kugou/ {
        proxy_pass http://127.0.0.1:3300/;
        proxy_hide_header Set-Cookie;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / { return 404; }
}
